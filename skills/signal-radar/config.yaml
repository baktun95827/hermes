# Signal Radar 配置文件

# 要监控的账号
accounts:
  - "elonmusk"
  # - "其他账号"

# 每个账号拉取推文数
tweets_per_account: 15

# 滚动次数（越多加载越多推文，但越慢）
scroll_count: 5

# 账号间延迟（秒）
delay_between_accounts: 5

# 认证
auth:
  cookies_file: "cookies.json"

# 去重状态文件（自动维护；建议随 memory/ 一起提交，便于换 VPS 后继续去重）
state_file: "memory/state.json"

# 记忆目录：账号一文件，一级主题一文件
memory_dir: "memory"

# 输出目录（prompt / report / summary / memory_update）
output_dir: "reports"

# 最近一次运行的索引文件，供 Hermes 稳定读取最新产物
latest_run_file: "latest_run.json"

# 预定义主题方向（LLM 会优先往这些类别归类，也可留空让它自动识别）
themes:
  - "个股/公司"
  - "宏观经济"
  - "地缘政治"
  - "能源/大宗商品"
  - "AI/人工智能"
  - "加密货币/区块链"
  - "科技行业"
  # 添加你关注的方向

# 一级主题别名归一化：模型写出这些别名时，会落回对应的 canonical 主题文件
theme_aliases:
  "个股/公司":
    - "股票"
    - "个股"
    - "公司"
    - "A股"
    - "美股"
    - "标的"
    - "equity"
  "宏观经济":
    - "宏观"
    - "经济环境"
    - "流动性"
    - "利率"
    - "通胀"
  "地缘政治":
    - "地缘"
    - "战争"
    - "中东"
    - "伊朗"
    - "霍尔木兹海峡"
  "能源/大宗商品":
    - "能源"
    - "原油"
    - "油价"
    - "大宗商品"
  "AI/人工智能":
    - "AI"
    - "人工智能"
    - "大模型"
    - "LLM"

# 二级主题别名归一化：按一级主题分别配置，避免 AI/监管 和 地缘/监管 混到一起
secondary_theme_aliases:
  "个股/公司":
    "A股标的":
      - "A股"
      - "沪深"
      - "中国股票"
    "美股标的":
      - "美股"
      - "US equity"
    "液冷/温控":
      - "液冷"
      - "温控"
      - "数据中心温控"
  "宏观经济":
    "流动性":
      - "流动性环境"
      - "资金面"
    "利率/通胀":
      - "利率"
      - "通胀"
      - "CPI"
  "地缘政治":
    "伊朗":
      - "Iran"
      - "伊朗局势"
    "霍尔木兹海峡":
      - "Hormuz"
      - "Strait of Hormuz"
  "能源/大宗商品":
    "原油":
      - "油价"
      - "WTI"
      - "Brent"
  "AI/人工智能":
    "Grok":
      - "grok3"
      - "Grok 3"
    "AI监管":
      - "AI policy"
      - "AI政策"
      - "监管"

# 发现模式
discovery:
  enabled: true
  min_interactions: 3

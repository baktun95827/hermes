# X Monitor v2 配置文件

# 要监控的账号
accounts:
  - "elonmusk"
  # - "其他账号"

# 每个账号拉取推文数
tweets_per_account: 15

# 滚动次数（越多加载越多推文，但越慢）
scroll_count: 5

# 账号间延迟（秒）
delay_between_accounts: 5

# 认证
auth:
  cookies_file: "cookies.json"

# 去重状态文件（自动维护，不需要手动编辑）
state_file: "state.json"

# 输出目录（prompt / report / summary / memory_update）
output_dir: "reports"

# 最近一次运行的索引文件，供 Hermes 稳定读取最新产物
latest_run_file: "latest_run.json"

# 预定义主题方向（LLM 会优先往这些类别归类，也可留空让它自动识别）
themes:
  - "AI/人工智能"
  - "加密货币/区块链"
  - "地缘政治"
  - "科技行业"
  - "Space/航天"
  # 添加你关注的方向

# 发现模式
discovery:
  enabled: true
  min_interactions: 3
